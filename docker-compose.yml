services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: radian
      POSTGRES_PASSWORD: radian
      POSTGRES_DB: radian
    ports: ["5432:5432"]
    volumes: ["radian_postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  radian_postgres:

